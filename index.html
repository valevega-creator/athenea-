<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Athenea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="css">
:root{--bg:#06080C;--surface:#0E1218;--ink:#F3EAD3;--muted:#A39A84;--line:rgba(226,184,74,.2);--sage:#E2B84A;--sage-soft:rgba(226,184,74,.13);--amber:#FFB020;--amber-soft:rgba(255,176,32,.12);--danger:#FF6B5A;color-scheme:dark;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#06080C;--surface:#0E1218;--ink:#F3EAD3;--muted:#A39A84;--line:rgba(226,184,74,.2);--sage:#E2B84A;--sage-soft:rgba(226,184,74,.13);--amber:#FFB020;--amber-soft:rgba(255,176,32,.12);--danger:#FF6B5A}}
:root[data-theme="dark"]{--bg:#06080C;--surface:#0E1218;--ink:#F3EAD3;--muted:#A39A84;--line:rgba(226,184,74,.2);--sage:#E2B84A;--sage-soft:rgba(226,184,74,.13);--amber:#FFB020;--amber-soft:rgba(255,176,32,.12);--danger:#FF6B5A}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "Manrope",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"Sora","Manrope",system-ui,sans-serif;margin:0;line-height:1.1}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--sage)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:6px}
.wrap{max-width:860px;margin:0 auto;padding:20px 18px 64px}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.company{font-size:clamp(30px,8vw,48px);font-weight:750;letter-spacing:-.02em;border:0;background:none;padding:0;width:100%;min-width:0}
.company:focus{outline:none;box-shadow:0 2px 0 var(--amber)}
.sub{color:var(--muted);margin:6px 0 0;font-size:15px}
.status{flex:none;font-size:13px;color:var(--muted);padding:5px 10px;border:1px solid var(--line);border-radius:999px;white-space:nowrap;margin-top:8px}
.status[data-s="dirty"]{color:var(--amber);border-color:var(--amber)}
.status[data-s="ok"]{color:var(--sage)}

/* temple of pillars */
.temple{margin:26px 0 8px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 14px 14px}
.roof{position:relative;height:40px;border-radius:10px 10px 4px 4px;background:var(--sage-soft);overflow:hidden;display:flex;align-items:center;justify-content:space-between;padding:0 14px}
.roof .bar{position:absolute;inset:0 auto 0 0;background:var(--sage);width:var(--p);transition:width .9s cubic-bezier(.2,.7,.2,1)}
.roof span{position:relative;font-weight:600;font-size:14px;mix-blend-mode:normal}
.roof .pct{font-family:"Sora",sans-serif;font-size:20px;font-weight:750}
.roof .onbar{color:var(--bg)}
.cols{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:0 6px}
.col{appearance:none;border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;text-align:center}
.cap{width:100%;height:10px;background:var(--line);border-radius:0 0 3px 3px}
.col.full .cap{background:var(--amber)}
.shaft{position:relative;width:66%;height:128px;background:var(--sage-soft);overflow:hidden;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.shaft .fill{position:absolute;left:0;right:0;bottom:0;height:var(--p);background:var(--sage);transition:height .9s cubic-bezier(.2,.7,.2,1)}
.shaft::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 22%,rgba(255,255,255,.14) 22% 24%)}
.base{width:100%;height:10px;background:var(--line);border-radius:3px 3px 0 0}
.col.active .shaft{outline:2px solid var(--amber);outline-offset:2px}
.col .lbl{font-size:12.5px;font-weight:600;margin-top:8px;line-height:1.2}
.col .num{font-size:12px;color:var(--muted)}
.ground{height:12px;margin:0 -4px;background:var(--ink);opacity:.85;border-radius:4px}
.pre .roof .bar{width:0}.pre .shaft .fill{height:0}

/* nav */
.nav{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 6px;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;cursor:pointer}
.nav button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* sections */
.view{margin-top:16px}
.head h2{font-size:clamp(24px,6vw,32px);font-weight:750;letter-spacing:-.01em}
.head p{color:var(--muted);margin:6px 0 0;max-width:62ch}
.meter{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px;color:var(--muted)}
.meter .track{flex:1;height:6px;border-radius:6px;background:var(--sage-soft);overflow:hidden}
.meter .track i{display:block;height:100%;background:var(--sage);width:var(--p)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:16px}
.card h3{font-size:19px;font-weight:600;margin-bottom:4px}
.hint{color:var(--muted);font-size:14px;margin:0 0 10px}

/* tasks */
.tasks{list-style:none;margin:16px 0 0;padding:0;border-top:1px solid var(--line)}
.task{display:grid;grid-template-columns:32px 1fr;gap:10px;padding:14px 2px;border-bottom:1px solid var(--line)}
.check{position:relative;width:26px;height:26px;margin-top:1px}
.check input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.check .box{position:absolute;inset:0;border:2px solid var(--muted);border-radius:8px;pointer-events:none;display:grid;place-items:center}
.check input:checked + .box{background:var(--sage);border-color:var(--sage)}
.check input:checked + .box::after{content:"";width:7px;height:12px;border:solid var(--bg);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.check input:focus-visible + .box{outline:2px solid var(--amber);outline-offset:2px}
.tt{margin:0;font-weight:600}
.td{margin:3px 0 0;color:var(--muted);font-size:14.5px;max-width:64ch}
.task.done .tt{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:13.5px}
.meta a,.linkbtn{font-weight:500}
.linkbtn{background:none;border:0;padding:0;color:var(--sage);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.linkbtn.del{color:var(--danger)}
.pillar-tag{font-size:12px;color:var(--muted)}
textarea,input[type=text],input[type=date],input[type=number],select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:15px}
textarea{margin-top:8px;min-height:74px;resize:vertical}
.add{display:flex;gap:8px;margin-top:14px}
.add input{flex:1}
.btn{flex:none;border:0;background:var(--ink);color:var(--bg);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}

/* data form */
.fields{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:600px){.fields{grid-template-columns:1fr 1fr}}
.fields label{display:block;font-size:13.5px;font-weight:600}
.fields label span{display:block;margin-bottom:4px}

/* budget */
.brow{display:grid;grid-template-columns:1fr 104px 104px 30px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.brow.headr{font-size:12.5px;color:var(--muted);font-weight:600;padding-top:0}
.brow input,.brow select{padding:8px 9px;font-size:14.5px}
.xbtn{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px}
.tot{border:1px solid var(--line);border-radius:12px;padding:12px}
.tot b{display:block;font-family:"Sora",sans-serif;font-size:24px;font-weight:750}
.tot small{color:var(--muted);font-size:13px}
.tot.key{background:var(--amber-soft);border-color:transparent}
@media (max-width:480px){.brow{grid-template-columns:1fr 84px 30px}.brow .kind{grid-column:1 / 2}.brow.headr .kh{display:none}}

.next{list-style:none;padding:0;margin:0}
.fine{color:var(--muted);font-size:13px;margin-top:28px;max-width:66ch}

/* companies */
.switch{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.switch select{flex:1;min-width:0;font-weight:600;background:var(--surface)}
.switch .btn{white-space:nowrap}
.cos{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:16px}
.co{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.co.cur{border-color:var(--sage);box-shadow:inset 0 0 0 1px var(--sage)}
.co h3{font-size:20px;font-weight:600}
.co .big{font-family:"Sora",sans-serif;font-size:30px;font-weight:750;line-height:1}
.minis{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;align-items:end;height:54px}
.minis span{display:block;height:100%;background:var(--sage-soft);border-radius:3px;position:relative;overflow:hidden}
.minis span i{position:absolute;left:0;right:0;bottom:0;height:var(--p);background:var(--sage)}
.minil{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;font-size:11px;color:var(--muted);text-align:center;margin-top:-4px}
.coacts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.newco{margin-top:16px}
.newco .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.newco .row input,.newco .row select{flex:1 1 200px}
/* stages */
.stages{list-style:none;padding:0;margin:16px 0 0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stages li{border:1px solid var(--line);border-radius:12px;padding:8px 8px 7px;background:var(--surface);display:flex;flex-direction:column;gap:1px;min-width:0}
.stages .sn{font-family:"Sora",sans-serif;font-weight:750;font-size:13px;color:var(--muted)}
.stages .sname{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stages .sc{font-size:12px;color:var(--muted)}
.stages li.cur{border-color:var(--amber);background:var(--amber-soft)}
.stages li.cur .sn{color:var(--amber)}
.stages li.done{background:var(--sage-soft);border-color:transparent}
.stages li.done .sn{color:var(--sage)}
.path-h{margin-top:28px}
.stage{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-top:10px;overflow:hidden}
.stage.is-cur{border-color:var(--amber)}
.stage-h{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:13px 14px;text-align:left;cursor:pointer}
.stage-h .sn{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--sage-soft);color:var(--sage);font-family:"Sora",sans-serif;font-weight:750}
.stage.is-cur .stage-h .sn{background:var(--amber);color:var(--bg)}
.st-t{flex:1;min-width:0}
.st-t b{display:block;font-size:16px}
.st-t small{display:block;color:var(--muted);font-size:13px}
.stage-h .sc{font-size:13px;color:var(--muted)}
.chev{width:9px;height:9px;border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(45deg);margin:0 4px 4px}
.stage-h[aria-expanded="true"] .chev{transform:rotate(-135deg);margin:4px 4px 0}
.stage .tasks{margin:0;padding:0 12px;border-top:1px solid var(--line)}
.stage .task:last-child{border-bottom:0}
.addst select{flex:0 1 190px;width:auto}
@media (max-width:520px){.addst{flex-wrap:wrap}.addst input{flex:1 1 100%}.addst select{flex:1}}
/* essentials */
.essg{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:600px){.essg{grid-template-columns:1fr 1fr}}
.essh{margin:0 0 6px;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ess ul{margin:0;padding-left:18px;font-size:14.5px}
.ess li{margin:2px 0}
/* advisor */
.advisor{border-color:var(--sage)}
.adv-h{display:flex;gap:12px;align-items:flex-start}
.adv-dot{flex:none;width:14px;height:14px;margin-top:6px;border-radius:50%;background:var(--sage);box-shadow:0 0 0 5px var(--sage-soft)}
.msgs{max-height:440px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin:12px 0 4px;padding:2px}
.msg{border-radius:14px;padding:10px 13px;font-size:15px;max-width:92%;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--ink);color:var(--bg);white-space:pre-wrap}
.msg.a{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
.msg.a p{margin:0 0 8px}.msg.a p:last-child{margin-bottom:0}
.msg.a ul,.msg.a ol{margin:4px 0 8px;padding-left:20px}
.msg.a li{margin:3px 0}
.msg.a .mh{font-weight:600}
.thinking{color:var(--muted);font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer;text-align:left}
.chip:disabled,.btn:disabled,.linkbtn:disabled{opacity:.5;cursor:default}
.ask{display:flex;gap:8px;align-items:flex-end;margin-top:12px}
.ask textarea{margin:0;min-height:46px;flex:1}
.adv-actions{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:14px}
.adv-err{color:var(--danger);font-size:14px;margin:10px 0 0}
.plan{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.plan ol{margin:0;padding-left:20px}
.plan li{margin:0 0 12px}
.added{color:var(--sage);font-weight:600;font-size:13.5px}
/* sub tabs */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:16px;background:var(--sage-soft);border-radius:12px;padding:4px}
.seg button{border:0;background:none;border-radius:9px;padding:9px 6px;font-weight:600;font-size:14.5px;cursor:pointer;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tool h3{font-size:20px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.formgrid label{display:block;font-size:13px;font-weight:600;min-width:0}
.formgrid label span{display:block;margin-bottom:4px}
.formgrid .wide{grid-column:1 / -1}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
.mnav b{font-family:"Sora",sans-serif;font-size:18px}
.mnav .btn{padding:6px 14px;font-size:18px;line-height:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.cal .dow{text-align:center;font-size:11.5px;color:var(--muted);font-weight:600}
.day{aspect-ratio:1/1;min-height:40px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:3px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer;font-size:13px}
.day i{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;min-height:6px}
.day.today{border-color:var(--amber);font-weight:700}
.day.pick{background:var(--amber-soft)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.tt .dot{margin-right:7px;vertical-align:middle}
.p-ig{background:var(--amber)}.p-yt{background:var(--danger)}.p-tt{background:var(--ink)}.p-otro{background:var(--sage)}
.calsum{font-size:13.5px;color:var(--muted);margin:10px 0 0;display:flex;flex-wrap:wrap;gap:6px 14px}
.plats{display:flex;gap:12px;flex-wrap:wrap}.plats span{display:inline-flex;align-items:center;gap:5px}
.posts{list-style:none;margin:16px 0 0;padding:0;border-top:1px solid var(--line)}
.post,.lrow{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.lrow{grid-template-columns:52px 1fr auto 26px;align-items:center}
.pdate{font-size:13px;font-weight:600;color:var(--muted);padding-top:2px}
.pbody{min-width:0}
.pact{display:flex;gap:4px;align-items:center}
.pact select{width:auto;padding:6px 8px;font-size:13px}
details summary{cursor:pointer;color:var(--sage);font-weight:500;font-size:13.5px;margin-top:4px}
.guion{font-size:14px;margin-top:6px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.guion p{margin:0 0 6px}.guion ol{margin:4px 0;padding-left:20px}
.ideas{display:grid;gap:10px;margin-top:14px}
.idea{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg)}
.idea ol{margin:6px 0;padding-left:20px;font-size:14.5px}
.idea .td{margin-top:6px}
.guide{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:10px}
.guide summary{font-size:15px;margin:0}
.guide ol{padding-left:20px;font-size:14.5px}.guide li{margin:6px 0}
.cbars{margin-top:14px}
.cbar{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:8px;align-items:center;font-size:13.5px;margin:5px 0}
.cn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct{height:8px;background:var(--sage-soft);border-radius:6px;overflow:hidden}.ct i{display:block;height:100%;background:var(--amber)}
.cv{font-weight:600}
.pos{color:var(--sage)}.neg{color:var(--danger)}
.lamt{font-weight:600;white-space:nowrap}
.tot small{display:block}
.deadlines{list-style:none;margin:12px 0 0;padding:0}
.deadlines li{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.deadlines .dd{text-align:center;border:1px solid var(--line);border-radius:10px;padding:6px 2px;font-size:11.5px;color:var(--muted);height:max-content}
.deadlines .dd b{display:block;font-family:"Sora",sans-serif;font-size:22px;color:var(--ink);line-height:1.1}
.deadlines .nextd .dd{background:var(--amber-soft);border-color:var(--amber)}
.dleft{margin:4px 0 0;font-size:13px;font-weight:600;color:var(--amber)}
.alertbox{border:1px solid var(--danger);border-radius:12px;padding:10px 14px;margin:12px 0}
.alertbox ul{margin:0;padding-left:18px;font-size:14.5px}
.docs{list-style:none;margin:10px 0 0;padding:0}
.doc{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--bg)}
.doc.st-ok{border-left:4px solid var(--sage)}.doc.st-na{opacity:.6}
.dhead{display:flex;gap:8px;align-items:center}.dhead .tt{flex:1;min-width:0}
.dhead select{width:auto;padding:6px 8px;font-size:13px}
.dfields{display:grid;grid-template-columns:1fr 150px;gap:8px;margin-top:8px}
.dfields input{padding:7px 9px;font-size:14px}
.exp{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.dlink{display:inline-block;margin-top:6px;font-size:13.5px}
.sop{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:10px;background:var(--bg)}
.sop summary{color:var(--ink);font-size:15px;display:flex;flex-direction:column}
.sop summary small{color:var(--muted);font-weight:400}
@media (max-width:480px){.formgrid{grid-template-columns:1fr}.dfields{grid-template-columns:1fr}.post{grid-template-columns:44px 1fr}.post .pact{grid-column:2}}

.prod{border:1px solid var(--line);border-radius:12px;padding:4px 12px 12px;margin-top:10px;background:var(--bg)}
.prod .pm{margin:8px 0 4px}
.profnote{background:var(--amber-soft);border-radius:10px;padding:8px 12px;font-size:14px;margin:0 0 12px}
.profcta{border-color:var(--amber);background:var(--amber-soft)}

.whyb{cursor:pointer;background:var(--ink);color:var(--bg);border:0}
.whyb .essh{color:var(--amber)}
.whyt{font-family:"Sora",sans-serif;font-size:19px;line-height:1.3;margin:0}
.whym{margin:10px 0 0;font-size:13.5px;opacity:.85}
.whym:empty{display:none}

.pc-next{font-size:14px;color:var(--muted)}

.al-high .aldot{background:var(--danger)}.al-mid .aldot{background:var(--amber)}.al-low .aldot{background:var(--sage)}
.linkbtn.mute{color:var(--muted)}
.boardmini{border-color:var(--sage)}
.ceo{background:var(--ink);color:var(--bg);border:0}.ceo .essh{color:var(--amber)}.whyt2 p{margin:0 0 8px;font-size:16px;line-height:1.5}.whyt2 strong{color:var(--amber)}

/* ===== Tema futurista dorado ===== */
body{background:radial-gradient(1100px 520px at 50% -180px,rgba(226,184,74,.16),transparent 70%),radial-gradient(700px 420px at 110% 110%,rgba(255,176,32,.07),transparent 70%),var(--bg);background-attachment:fixed;letter-spacing:.005em}

.company::placeholder{color:var(--muted)}
.essh{color:var(--sage);letter-spacing:.16em;font-size:11.5px}
.card,.stage,.pcard,.kpi,.doc,.sop,.idea,.chief,.rock,.prod,.guide,.rung,.sc-chip,.stages li,.tot,.day,.post,.prow{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.012));border-color:var(--line)}
.card,.pcard,.stage{box-shadow:inset 0 1px 0 rgba(255,241,196,.06),0 12px 32px rgba(0,0,0,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

.linkbtn,a{color:var(--sage)}
textarea,input[type=text],input[type=date],input[type=number],select{background:rgba(0,0,0,.4);border-color:var(--line);color:var(--ink)}

.ptabs button[aria-pressed="true"]{background:linear-gradient(135deg,#FBE08A,#B8860B);color:#140F03;border-color:transparent}

.chip{background:rgba(226,184,74,.06);border-color:rgba(226,184,74,.3);color:var(--ink)}
.chip:hover{border-color:var(--sage)}
.whyb,.ceo{background:linear-gradient(135deg,rgba(226,184,74,.16),rgba(255,176,32,.04));color:var(--ink);border:1px solid rgba(226,184,74,.4)}
.ceo .essh,.whyb .essh{color:var(--amber)}.whyt2 strong{color:#FBE08A}
.bnav{background:rgba(6,8,12,.82);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line)}

function freshTasks(){
  var tasks={};
  PILLARS.forEach(function(p){
    tasks[p.id]=DEFAULTS[p.id].map(function(t,i){return {id:p.id+'-'+(i+1),t:t[0],d:t[1],link:t[2]||'',done:false,notes:'',st:1};});
  });
  addStageTasks(tasks);
  return tasks;
}
function addStageTasks(tasks){
  PILLARS.forEach(function(p){
    var l=tasks[p.id]||(tasks[p.id]=[]);var have={};l.forEach(function(t){have[t.id]=1;});
    [2,3,4].forEach(function(n){((STAGE_TASKS[p.id]||{})[n]||[]).forEach(function(t,i){
      var id=p.id+'-s'+n+'-'+(i+1);if(!have[id])l.push({id:id,t:t[0],d:t[1],link:t[2]||'',done:false,notes:'',st:n});});});
  });
}
function stOf(t){return t.st||1;}
function curStage(l){for(var n=1;n<=4;n++){if(l.some(function(t){return stOf(t)===n&&!t.done;}))return n;}return 4;}
function sortedPending(l){return l.filter(function(t){return !t.done;}).sort(function(a,b){return stOf(a)-stOf(b);});}
function freshCompany(id,name){

    budget:BUDGET_DEFAULT.map(function(b,i){return {id:'b'+(i+1),n:b[0],a:'',k:b[1]};}),seq:100};
}
function cloneAsTemplate(src,id,name){
  var c=freshCompany(id,name);
  PILLARS.forEach(function(p){
    c.tasks[p.id]=(src.tasks[p.id]||[]).map(function(t){return {id:t.id,t:t.t,d:t.d,link:t.link,done:false,notes:'',custom:t.custom,st:t.st||1};});
  });
  c.budget=src.budget.map(function(b){return {id:b.id,n:b.n,a:'',k:b.k};});
  c.seq=src.seq||100;
  return c;
}
function upgrade(s){
  if(!s)return null;
  if(s.v===2)return s;
  if(s.v===1){var c={id:'e1',company:s.company,tasks:s.tasks,budget:s.budget,seq:s.seq||100};return {v:2,updatedAt:s.updatedAt||0,current:'e1',companies:[c],seq:1};}
  return null;
}
function freshState(){return {v:2,updatedAt:0,current:'e1',companies:[freshCompany('e1','')],seq:1};}

var embedded=null;
try{embedded=upgrade(JSON.parse(document.getElementById('state').textContent));}catch(e){}
var state=embedded||freshState();
var local=null;
try{local=upgrade(JSON.parse(localStorage.getItem(LS_KEY2)||'null'))||upgrade(JSON.parse(localStorage.getItem(LS_KEY)||'null'));}catch(e){}
var pendingFromLocal=false;
if(local&&(local.updatedAt||0)>(state.updatedAt||0)){state=local;pendingFromLocal=true;}

state.companies.forEach(function(c){addStageTasks(c.tasks);});

function co(){var c=state.companies.filter(function(x){return x.id===state.current;})[0];if(!c){c=state.companies[0];state.current=c.id;}return c;}
function coName(c){return c.company.name||'Empresa sin nombre';}

var ui={view:'resumen',scroll:0,open:[]};
try{var s=JSON.parse(sessionStorage.getItem('sistema-ui')||'null');if(s){ui=s;sessionStorage.removeItem('sistema-ui');}}catch(e){}
var openNotes=new Set(ui.open||[]);
var view=ui.view||'resumen';
var confirmDel=null;
var openStages=ui.stages||{};
var sub=ui.sub||'camino';

var cap=null,capReady=false,readOnly=false,dirty=pendingFromLocal,timer=null,retried=false,saving=false;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pct(list){if(!list.length)return 0;return Math.round(list.filter(function(t){return t.done;}).length/list.length*100);}
function allTasks(c){c=c||co();var a=[];PILLARS.forEach(function(p){a=a.concat(c.tasks[p.id]||[]);});return a;}
function money(n){return new Intl.NumberFormat('es-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n||0);}
function num(v){var n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n;}

function statusInfo(){
  if(saving)return ['dirty','Guardando…'];
  if(!capReady)return ['','Cargando…'];
  if(readOnly)return ['','Solo lectura'];
  if(!cap)return ['','Guardado en este dispositivo'];
  if(dirty)return ['dirty','Cambios sin guardar'];
  return ['ok','Guardado'];
}
function paintStatus(){var el=document.getElementById('status');if(!el)return;var s=statusInfo();el.dataset.s=s[0];el.textContent=s[1];}

function temple(){
  var c=co();var total=pct(allTasks());
  var cols=PILLARS.map(function(p){
    var l=c.tasks[p.id]||[];var v=pct(l);var d=l.filter(function(t){return t.done;}).length;
    return '<button class="col'+(v===100?' full':'')+(view===p.id?' active':'')+'" data-act="go" data-v="'+p.id+'" aria-label="'+esc(p.name)+': '+d+' de '+l.length+' listas">'+
      '<span class="cap"></span><span class="shaft" style="--p:'+v+'%"><span class="fill"></span></span><span class="base"></span>'+
      '<span class="lbl">'+esc(p.short)+'</span><span class="num">'+d+'/'+l.length+'</span></button>';
  }).join('');
  return '<section class="temple" aria-label="Avance por pilar"><div class="roof" style="--p:'+total+'%"><span class="bar"></span>'+
    '<span class="'+(total>=30?'onbar':'')+'">Tu empresa, construida</span><span class="pct'+(total>=92?' onbar':'')+'">'+total+'%</span></div>'+
    '<div class="cols">'+cols+'</div><div class="ground"></div></section>';
}

function nav(){
  var items=[['resumen','Resumen'],['perfil','Perfil'],['control','Control'],['crecer','Crecimiento']].concat(PILLARS.map(function(p){return [p.id,p.short];})).concat([['presupuesto','Presupuesto'],['empresas','Mis empresas ('+state.companies.length+')']]);
  return '<nav class="nav" aria-label="Secciones">'+items.map(function(i){
    return '<button data-act="go" data-v="'+i[0]+'" aria-current="'+(view===i[0])+'">'+i[1]+'</button>';}).join('')+'</nav>';
}

function taskItem(t,pid,showPillar){
  var open=openNotes.has(co().id+':'+t.id);
  var p=PILLARS.filter(function(x){return x.id===pid;})[0];
  return '<li class="task'+(t.done?' done':'')+'"><label class="check"><input type="checkbox" data-act="toggle" data-p="'+pid+'" data-id="'+t.id+'"'+(t.done?' checked':'')+' aria-label="'+esc(t.t)+'"><span class="box"></span></label>'+
    '<div><p class="tt">'+esc(t.t)+'</p>'+(t.d?'<p class="td">'+esc(t.d)+'</p>':'')+
    '<div class="meta">'+(showPillar?'<span class="pillar-tag">'+esc(p.name)+' · Etapa '+stOf(t)+': '+STAGES[stOf(t)-1].name+'</span>':'')+
    (t.link?'<a href="'+esc(t.link)+'" target="_blank" rel="noopener">Sitio oficial</a>':'')+
    '<button class="linkbtn" data-act="notes" data-id="'+t.id+'" aria-expanded="'+open+'">'+(t.notes?'Notas (1)':'Agregar nota')+'</button>'+
    (t.custom?'<button class="linkbtn del" data-act="del" data-p="'+pid+'" data-id="'+t.id+'">Eliminar</button>':'')+
    '</div>'+(open?'<textarea data-act="note" data-p="'+pid+'" data-id="'+t.id+'" placeholder="Fechas, costos, contactos, lo que necesites recordar">'+esc(t.notes)+'</textarea>':'')+
    '</div></li>';
}

function datosCard(){var c=co().company;
  function f(key,label,type,ph){return '<label><span>'+label+'</span><input type="'+(type||'text')+'" data-act="co" data-k="'+key+'" value="'+esc(c[key])+'"'+(ph?' placeholder="'+esc(ph)+'"':'')+'></label>';}
  var ent=['LLC','Corporación (C-Corp)','LLC con elección S-Corp','Sole proprietorship','Por decidir'];
  return '<div class="card"><h3>Datos legales de la empresa</h3><p class="hint">Lo que vas a necesitar a mano una y otra vez.</p><div class="fields">'+
    '<label><span>Tipo de entidad</span><select data-act="co" data-k="entity">'+ent.map(function(e){return '<option'+(c.entity===e?' selected':'')+'>'+e+'</option>';}).join('')+'</select></label>'+
    f('formed','Fecha de formación','date')+f('ein','EIN','text','00-0000000')+f('entityNo','Entity Number','text','Número de la empresa en Utah')+f('agent','Agente registrado')+f('bank','Banco de la empresa')+
    f('renewal','Próxima renovación en Utah','date')+f('cpa','Contador (CPA)','text','Nombre y contacto')+'</div></div>'+
    '<p class="fine">Esta guía es un punto de partida general para Utah y no reemplaza la asesoría de un abogado o contador. Los trámites y costos cambian; confírmalos siempre en los sitios oficiales.</p>';}
function rungStage(){return Math.min(G().level||ensureLevel(),4);}
function nextPillarTasks(){var c=co(),stn=rungStage(),out=[];PILLARS.forEach(function(p){var l=c.tasks[p.id]||[];var t=l.filter(function(x){return stOf(x)<=stn&&!x.done;}).sort(function(a,b){return stOf(a)-stOf(b);})[0];if(t)out.push({p:p,t:t});});return out;}
function weekCard(){var g=G(),r=g.rpm,acts=r.acts,d=acts.filter(function(a){return a.done;}).length,nx=nextPillarTasks();
  var canFill=nx.some(function(x){return !acts.some(function(a){return a.tid===x.t.id;});});
  if(!acts.length&&!r.res)return '<div class="card weekc"><p class="essh">Tu semana</p><h3>Aún no planificas esta semana</h3><p class="td">Tu lista de la semana sale de tus pilares: el siguiente paso de cada uno.</p>'+
    (canFill?'<div class="add"><button class="btn" data-act="weekfill">Armar mi semana con mis pilares</button></div>':'<div class="add"><button class="btn" data-act="go" data-v="crecer">Planificar mi semana</button></div>')+'</div>';
  return '<div class="card weekc"><div class="lm-top"><div><p class="essh">Tu semana</p><h3>'+(r.res?esc(r.res):'Lo que haces esta semana')+'</h3></div><span class="lm-now">'+d+'/'+acts.length+'</span></div>'+
    (acts.length?'<ul class="tasks">'+acts.map(function(a){var pn=a.tp?(PILLARS.filter(function(p){return p.id===a.tp;})[0]||{}).short:'';
      return '<li class="task'+(a.done?' done':'')+'"><label class="check"><input type="checkbox" data-act="rpmck" data-id="'+a.id+'"'+(a.done?' checked':'')+' aria-label="'+esc(a.t)+'"><span class="box"></span></label><div><p class="tt">'+esc(a.t)+'</p>'+(pn?'<div class="meta"><span class="pillar-tag">'+esc(pn)+'</span></div>':'')+'</div></li>';}).join('')+'</ul>':'')+
    '<div class="add">'+(canFill&&acts.length<7?'<button class="btn ghost" data-act="weekfill">Traer siguientes pasos de mis pilares</button>':'')+'<button class="btn ghost" data-act="go" data-v="crecer">Editar</button></div></div>';}
function pillarsMini(){var c=co(),stn=rungStage(),R=RUNGS[stn-1];
  return '<button class="card pmini" data-act="go" data-v="pilares"><p class="essh">Pilares · camino a '+R.label+'</p><span class="pm-rows">'+PILLARS.map(function(p){var sl=(c.tasks[p.id]||[]).filter(function(t){return stOf(t)===stn;}),sd=sl.filter(function(t){return t.done;}).length,v=sl.length?Math.round(sd/sl.length*100):100;
    return '<span class="pm-row"><span>'+esc(p.short)+'</span><span class="track" style="--p:'+v+'%"><i></i></span><small>'+sd+'/'+sl.length+'</small></span>';}).join('')+'</span></button>';}
var ath={busy:false,err:''};
function athenaToday(){var g=G();return g.athena&&g.athena.date===todayStr()?g.athena:null;}
function athenaCard(home){var a=athenaToday(),ai=sampleState==='ok';
  var body='';
  if(ath.busy)body='<p class="thinking">Athenea está revisando toda tu empresa…</p>';
  else if(a)body='<div class="prio"><p class="essh">Tu prioridad de hoy</p><p class="prio-t">'+esc(a.prioridad)+'</p><p class="td">'+esc(a.porque)+'</p>'+
    (a.paso?'<p class="td"><b>Empieza así:</b> '+esc(a.paso)+'</p>':'')+
    '<div class="add">'+(a.added?'<span class="added">En tu semana</span>':'<button class="btn" data-act="athadd">Agregar a mi semana</button>')+(ai?'<button class="btn ghost" data-act="athgo">Preguntar de nuevo</button>':'')+'</div></div>';
  else body=ai?'<div class="add"><button class="btn" data-act="athgo">¿Cuál es mi prioridad hoy?</button></div>':'<p class="hint">Athenea funciona cuando la IA está conectada.</p>';
  return '<div class="card athena"><div class="ath-h"><span class="ath-ic">'+BRAIN_SVG+'</span><div>'+(home?'<h3>¿En qué me enfoco hoy?</h3><p class="td">Athenea revisa toda tu empresa y te dice la única cosa que más importa hoy.</p>':'<h2>Athenea</h2><p class="td">Tu cerebro CEO. Ve toda la empresa y te dice cuál es tu prioridad.</p>')+'</div></div>'+
    (ath.err?'<p class="adv-err">'+esc(ath.err)+'</p>':'')+body+'</div>';}
function athenaGo(){if(!sampleFn||ath.busy)return;ath.busy=true;ath.err='';render();
  var r=G().rpm,wk=r.acts.map(function(a){return '['+(a.done?'x':' ')+'] '+a.t;}).join('\n');
  var prompt=instructions('all')+'\n\n'+boardContext()+'\n\nSU SEMANA:\n'+(wk||'(sin plan de la semana)')+
   '\n\nTAREA: Mirando TODA la empresa, dime cuál es su prioridad número uno HOY: la acción que más la acerca a su próximo escalón o que evita el mayor riesgo. Una sola cosa, no una lista. "prioridad": acción concreta que empieza con verbo (máx. 90 caracteres). "porque": por qué es lo más importante ahora, con sus datos (máx. 220). "paso": cómo empezar en los próximos 10 minutos (máx. 140).\nResponde SOLO con JSON válido: {"prioridad":"","porque":"","paso":""}';
  sampleFn.json(prompt,{cache:false}).then(function(res){if(!res||!res.prioridad)throw {code:'invalid_json'};
    G().athena={date:todayStr(),prioridad:String(res.prioridad).slice(0,160),porque:String(res.porque||'').slice(0,400),paso:String(res.paso||'').slice(0,260)};commit(true);})
  .catch(function(e){var code=e&&e.code;if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].indexOf(code)>-1)sampleState='denied';else if(code!=='cancelled')ath.err=errCopy(code);})
  .then(function(){ath.busy=false;render();});}
function resumen(){
  return '<div class="view athview"><div class="ath-hero"><div class="ath-orb"><img src="'+ATHENA_HERO+'" alt="Athenea"></div><h2 class="ath-name">ATHENEA</h2><p class="td">Tu cerebro CEO. Ve toda tu empresa y la dirige contigo.</p>'+'</div>'+(sampleState==='ok'||athenaToday()?athenaCard(true):'')+advisorBlock('all')+'</div>';
}

function publishNow(){
  if(!cap||readOnly||!dirty)return;
  if(adv.busy||adv.planBusy||ideas.busy||sopBusy||profBusy||gv.diagBusy||gv.fpBusy||gv.tenBusy||offBusy||lv.busy!=null||cv.busy||cv.portBusy||cv.unlockBusy||rnw.busy||bd.busy||ath.busy){clearTimeout(timer);timer=setTimeout(publishNow,4000);return;}
  var ae=document.activeElement;
  if(ae&&(ae.tagName==='TEXTAREA'||ae.tagName==='INPUT')&&ae.type!=='checkbox'){clearTimeout(timer);timer=setTimeout(publishNow,3000);return;}
  saving=true;paintStatus();stashUI();
  cap.publish(buildDoc()).then(function(){saving=false;dirty=false;paintStatus();}).catch(function(e){
    saving=false;var code=e&&e.code;
    if(['not_writer','not_granted','not_declared','consent_required','capability_disabled','capability_removed'].indexOf(code)>-1){readOnly=true;}
    else if(code==='upstream_error'&&!retried){retried=true;setTimeout(publishNow,1200+Math.random()*1500);}
    else if(code==='rate_limited'){clearTimeout(timer);timer=setTimeout(publishNow,15000);}
    paintStatus();
  });
}

function inl(x){return x.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');}
function md(t){
  var lines=esc(t).split('\n'),out='',list=null;
  function close(){if(list){out+='</'+list+'>';list=null;}}
  lines.forEach(function(l){
    var m;
    if(/^\s*[-*•]\s+/.test(l)){if(list!=='ul'){close();out+='<ul>';list='ul';}out+='<li>'+inl(l.replace(/^\s*[-*•]\s+/,''))+'</li>';}
    else if((m=l.match(/^\s*(\d+)[.)]\s+(.*)/))){if(list!=='ol'){close();out+='<ol start="'+m[1]+'">';list='ol';}out+='<li>'+inl(m[2])+'</li>';}
    else if(/^#{1,6}\s+/.test(l)){close();out+='<p class="mh">'+inl(l.replace(/^#{1,6}\s+/,''))+'</p>';}
    else if(/^\s*(-{3,}|_{3,})\s*$/.test(l)){close();}
    else if(!l.trim()){close();}
    else{close();out+='<p>'+inl(l)+'</p>';}
  });
  close();return out;
}

function context(scope){
  var c=co(),k=c.company,bt=budgetTotals(c);
  var L=['EMPRESA: '+(k.name||'(sin nombre aún)'),'Estado: Utah, Estados Unidos','Tipo de entidad: '+(k.entity||'por decidir'),
    'Fecha de formación: '+(k.formed||'aún no registrada'),'EIN obtenido: '+(k.ein?'sí':'no'),'Agente registrado: '+(k.agent?'sí':'no definido'),
    'Banco empresarial: '+(k.bank||'no definido'),'Contador: '+(k.cpa?'sí':'no tiene aún'),
    'Presupuesto anotado: '+money(bt.once)+' para abrir, '+money(bt.monthly)+' al mes para operar','','PERFIL DEL NEGOCIO:',profileText(),'','CRECIMIENTO:',growthText()];
  function taskLine(t){return '['+(t.done?'x':' ')+'] '+t.t+(t.notes?' (notas: '+t.notes.slice(0,300).replace(/\n/g,' ')+')':'');}
  if(isWide(scope)){
    L.push('','AVANCE POR PILAR:');
    PILLARS.forEach(function(p){var l=c.tasks[p.id]||[];var cs=curStage(l);
      L.push('- '+p.name+': '+pct(l)+'% total, etapa actual '+cs+' ('+STAGES[cs-1].name+'). Próximos pendientes: '+(sortedPending(l).slice(0,3).map(function(t){return t.t;}).join('; ')||'ninguno'));});
  }else{
    var p=advInfo(scope),l=c.tasks[scope]||[],cs=curStage(l);
    L.push('','PILAR: '+p.name,'Etapa actual: '+cs+' ('+STAGES[cs-1].name+': '+STAGES[cs-1].goal+')');
    STAGES.forEach(function(st){var sl=l.filter(function(t){return stOf(t)===st.n;});if(!sl.length)return;
      L.push('Etapa '+st.n+' - '+st.name+':');sl.forEach(function(t){L.push('  '+taskLine(t));});});
    var others=PILLARS.filter(function(x){return x.id!==scope;}).map(function(x){return x.short+' '+pct(c.tasks[x.id]||[])+'%';}).join(', ');
    L.push('','Avance en los otros pilares: '+others);
  }
  return L.join('\n');
}

function askAdvisor(scope,text){
  text=(text||'').trim();if(!text||!sampleFn||adv.busy)return;
  var h=loadHist(scope);h.push({role:'user',content:text});saveHist(scope,h);
  var ctl=new AbortController();
  adv.busy=true;adv.scope=scope;adv.partial='';adv.ctl=ctl;adv.err='';render();
  var turns=h.slice(-10);while(turns.length&&turns[0].role!=='user')turns.shift();
  turns=turns.map(function(m,i){return {role:m.role,content:i===0?instructions(scope)+'\n\nMensaje de la dueña:\n'+m.content:m.content};});
  sampleFn(turns,{signal:ctl.signal,cache:false,onText:function(ev){adv.partial=ev.text;var el=document.getElementById('partial');if(el){el.innerHTML=md(ev.text);var box=el.parentNode;if(box)box.scrollTop=box.scrollHeight;}}})
  .then(function(r){var hh=loadHist(scope);hh.push({role:'assistant',content:r.text+(r.truncated?'\n\n*(Respuesta cortada. Pídele que continúe.)*':'')});saveHist(scope,hh);})
  .catch(function(e){
    var code=e&&e.code;var keep=(e&&e.text)||'';
    if(keep){var hh=loadHist(scope);hh.push({role:'assistant',content:keep+(code==='cancelled'?'\n\n*(Detenida)*':'')});saveHist(scope,hh);}
    if(code==='not_granted'||code==='sampling_disabled'||code==='not_declared'||code==='capability_disabled'||code==='capability_removed'){sampleState='denied';}
    else if(code!=='cancelled'){adv.err=errCopy(code);adv.errScope=scope;}
  })
  .then(function(){adv.busy=false;adv.ctl=null;adv.partial='';render();});

function makePlan(scope){
  if(!sampleFn||adv.busy||adv.planBusy)return;
  adv.planBusy=true;adv.planScope=scope;adv.err='';render();
  var fmt=isWide(scope)
    ?'{"pasos":[{"pilar":"legal|fin|tax|mkt|ops","titulo":"...","detalle":"..."}]}'
    :'{"pasos":[{"titulo":"...","detalle":"..."}]}';
  var prompt=instructions(scope)+'\n\nTAREA: Crea su plan de acción para las próximas 4 semanas: de 3 a 5 pasos concretos, en orden, que la acerquen a completar su etapa actual'+(isWide(scope)?' en los pilares más atrasados o más urgentes':'')+'. No repitas tareas que ya aparecen en su lista. Cada título debe ser una acción corta que empiece con verbo (máximo 70 caracteres) y cada detalle debe decir cómo hacerla en 1 o 2 frases (máximo 220 caracteres).'+
    (isWide(scope)?' En "pilar" usa exactamente uno de: legal, fin, tax, mkt, ops.':'')+
    '\nResponde SOLO con JSON válido, sin texto adicional, con esta forma exacta: '+fmt;
  sampleFn.json(prompt,{cache:false}).then(function(res){
    var steps=(res&&Array.isArray(res.pasos))?res.pasos:[];
    steps=steps.filter(function(x){return x&&typeof x.titulo==='string'&&x.titulo.trim();}).slice(0,6).map(function(x){
      var pil=isWide(scope)?(PILLARS.some(function(p){return p.id===x.pilar;})?x.pilar:'ops'):scope;
      return {titulo:x.titulo.trim().slice(0,120),detalle:String(x.detalle||'').trim().slice(0,400),pilar:pil};});
    if(!steps.length)throw {code:'invalid_json'};
    adv.plans[co().id+':'+scope]=steps;
  }).catch(function(e){
    var code=e&&e.code;
    if(code==='not_granted'||code==='sampling_disabled'||code==='not_declared'||code==='capability_disabled'||code==='capability_removed'){sampleState='denied';}
    else if(code!=='cancelled'){adv.err=errCopy(code);adv.errScope=scope;}
  }).then(function(){adv.planBusy=false;adv.planScope=null;render();});
}

function addDays(ds,n){var d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+n);return toDS(d);}
function mondayOf(ds){var d=new Date(ds+'T00:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return toDS(d);}
function wkLabel(wk){return 'Semana del '+dLabel(wk);}
function thisWeek(){return mondayOf(todayStr());}
function qKey(ds){ds=ds||todayStr();return ds.slice(0,4)+'-T'+(Math.floor((+ds.slice(5,7)-1)/3)+1);}
function qEnd(qk){var y=+qk.slice(0,4),q=+qk.slice(-1);return toDS(new Date(y,q*3,0));}
function qLabel(qk){var q=+qk.slice(-1);return ['Ene–Mar','Abr–Jun','Jul–Sep','Oct–Dic'][q-1]+' '+qk.slice(0,4);}
var cv={tab:'score',wk:null,edit:false,busy:null,err:'',rockSug:[],unlockOpen:false,unlockOut:'',unlockBusy:false,repMonth:null,pipeStage:'lead',portBusy:false};
function C(){var g=G();g.kpis=g.kpis||[];g.weeks=g.weeks||{};g.reviews=g.reviews||{};g.rocks=g.rocks||[];g.reports=g.reports||{};g.decisions=g.decisions||[];return g;}
var KPI_SUG=[['Ventas de la semana','$','up','sales'],['Clientes nuevos','#','up'],['Prospectos nuevos','#','up'],['Tasa de conversión','%','up'],['Caja disponible','$','up'],['Publicaciones','#','up'],['Gasto en anuncios','$','down'],['Entregas a tiempo','%','up']];
function weekSales(wk){var end=addDays(wk,6),s=0;T().ledger.forEach(function(e){if(e.type==='in'&&e.date>=wk&&e.date<=end)s+=num(e.amt);});return s;}
function kpiVal(k,wk){if(k.auto==='sales')return weekSales(wk);var w=C().weeks[wk];var v=w&&w[k.id];return (v===''||v==null)?null:num(v);}
function kpiStatus(k,v){if(v==null||k.target===''||k.target==null)return 'none';var t=num(k.target);if(!t&&t!==0)return 'none';
  if(k.dir==='down'){return v<=t?'ok':v<=t*1.2?'warn':'bad';}return v>=t?'ok':v>=t*0.8?'warn':'bad';}
function fmtK(k,v){if(v==null)return '—';return k.unit==='$'?money(v):k.unit==='%'?(Math.round(v*10)/10)+'%':String(Math.round(v*100)/100);}
function spark(k,wk){var vals=[];for(var i=7;i>=0;i--){vals.push(kpiVal(k,addDays(wk,-7*i)));}
  var nums=vals.filter(function(v){return v!=null;});if(nums.length<2)return '';
  var mx=Math.max.apply(null,nums.concat([num(k.target)||0])),mn=Math.min.apply(null,nums.concat([num(k.target)||mx]));if(mx===mn){mx+=1;}
  var pts=[];vals.forEach(function(v,i){if(v!=null)pts.push((i*100/7).toFixed(1)+','+(26-(v-mn)/(mx-mn)*22).toFixed(1));});
  var ty=k.target!==''&&k.target!=null?(26-(num(k.target)-mn)/(mx-mn)*22).toFixed(1):null;
  return '<svg class="spark" viewBox="-2 0 104 30" preserveAspectRatio="none" aria-hidden="true">'+(ty!=null?'<line x1="0" x2="100" y1="'+ty+'" y2="'+ty+'" class="tl"/>':'')+'<polyline points="'+pts.join(' ')+'"/></svg>';}
function weekCounts(wk){var c={ok:0,warn:0,bad:0,none:0};C().kpis.forEach(function(k){c[kpiStatus(k,kpiVal(k,wk))]++;});return c;}

function scoreTab(){var g=C(),wk=cv.wk||thisWeek(),cur=wk===thisWeek();
  if(!g.kpis.length)return '<div class="card"><h3>Elige tus números</h3><p class="hint">Entre 5 y 8 números que te digan, en 2 minutos, si la empresa va bien. Toca para agregar; después les pones meta.</p><div class="chips">'+
    KPI_SUG.map(function(s,i){return '<button class="chip" data-act="kpisug" data-i="'+i+'">'+esc(s[0])+'</button>';}).join('')+'</div></div>';
  var wc=weekCounts(wk);
  var cards=g.kpis.map(function(k){var v=kpiVal(k,wk),st=kpiStatus(k,v),raw=(g.weeks[wk]||{})[k.id];
    if(cv.edit)return '<div class="kpi"><div class="formgrid"><label class="wide"><span>Nombre</span><input type="text" data-act="kpif" data-id="'+k.id+'" data-f="n" value="'+esc(k.n)+'"></label>'+
      '<label><span>Unidad</span><select data-act="kpif" data-id="'+k.id+'" data-f="unit">'+opts({'$':'Dólares','#':'Cantidad','%':'Porcentaje'},k.unit)+'</select></label>'+
      '<label><span>Meta semanal</span><input type="number" inputmode="decimal" data-act="kpif" data-id="'+k.id+'" data-f="target" value="'+esc(k.target)+'"></label>'+
      '<label class="wide"><span>Mejor si…</span><select data-act="kpif" data-id="'+k.id+'" data-f="dir">'+opts({up:'Sube (ventas, clientes)',down:'Baja (costos, reclamos)'},k.dir)+'</select></label></div>'+
      '<button class="linkbtn del" data-act="kpidel" data-id="'+k.id+'">Quitar este número</button></div>';
    return '<div class="kpi st-'+st+'"><div class="kh"><p class="tt">'+esc(k.n)+'</p><span class="kt">'+(k.target!==''&&k.target!=null?'Meta '+fmtK(k,num(k.target)):'<button class="linkbtn" data-act="kpiedit">Poner meta</button>')+'</span></div>'+
      '<div class="kb">'+(k.auto==='sales'?'<span class="kv">'+fmtK(k,v)+'</span><small class="kauto">Desde tu libro de ingresos</small>':
      '<input type="number" inputmode="decimal" class="kin" data-act="kpiv" data-id="'+k.id+'" value="'+esc(raw==null?'':raw)+'" placeholder="Valor" aria-label="'+esc(k.n)+' '+wkLabel(wk)+'">')+spark(k,wk)+'</div></div>';}).join('');
  var sugLeft=KPI_SUG.filter(function(s){return !g.kpis.some(function(k){return k.n===s[0];});});
  return '<div class="mnav"><button class="btn ghost" data-act="wkm" data-k="-1" aria-label="Semana anterior">‹</button><b>'+wkLabel(wk)+(cur?' (esta)':'')+'</b><button class="btn ghost" data-act="wkm" data-k="1" aria-label="Semana siguiente"'+(cur?' disabled':'')+'>›</button></div>'+
    '<p class="wsum"><span class="pill ok">'+wc.ok+' en verde</span><span class="pill warn">'+wc.warn+' cerca</span><span class="pill bad">'+wc.bad+' en rojo</span></p>'+
    '<div class="kpis">'+cards+'</div>'+
    '<div class="adv-actions"><button class="linkbtn" data-act="kpiedit">'+(cv.edit?'Listo':'Editar números y metas')+'</button></div>'+
    (cv.edit?'<div class="card"><h3>Agregar un número</h3><div class="chips">'+sugLeft.map(function(s){return '<button class="chip" data-act="kpisug" data-i="'+KPI_SUG.indexOf(s)+'">'+esc(s[0])+'</button>';}).join('')+
      '<button class="chip" data-act="kpinew">Otro número</button></div></div>':'')+
    '<p class="fine">Verde: alcanzaste la meta. Cerca: estás a menos de 20%. Rojo: más lejos. La línea punteada del gráfico es tu meta; el gráfico muestra las últimas 8 semanas.</p>';}

function revTab(){var g=C(),wk=thisWeek(),r=g.reviews[wk]||{},wc=weekCounts(wk),ai=sampleState==='ok';
  var past=Object.keys(g.reviews).filter(function(k){return k!==wk&&g.reviews[k].closed;}).sort().reverse().slice(0,8);
  var prios=[0,1,2].map(function(i){return '<input type="text" data-act="revp" data-i="'+i+'" value="'+esc((r.prios||[])[i]||'')+'" placeholder="Prioridad '+(i+1)+'" aria-label="Prioridad '+(i+1)+'">';}).join('');
  return '<div class="card"><h3>Revisión semanal de CEO</h3><p class="hint">30 minutos, el mismo día cada semana. Aquí decides en frío para que durante la semana solo ejecutes.</p>'+
    (r.closed?'<p class="added">Semana cerrada. Tus prioridades ya están en tu plan de la semana.</p>':'')+
    '<ol class="ritual"><li><p class="tt">Mira tus números</p><p class="td">'+(g.kpis.length?wc.ok+' en verde, '+wc.warn+' cerca y '+wc.bad+' en rojo. <button class="linkbtn" data-act="ctab" data-v="score">Actualizar números</button>':'Aún no eliges tus números. <button class="linkbtn" data-act="ctab" data-v="score">Elegirlos</button>')+'</p></li>'+
    '<li><p class="tt">Tus victorias</p><textarea rows="2" data-act="revf" data-k="wins" placeholder="Qué salió bien, por pequeño que sea">'+esc(r.wins||'')+'</textarea></li>'+
    '<li><p class="tt">Lo que no salió y por qué</p><textarea rows="2" data-act="revf" data-k="miss" placeholder="Sin culpa: solo qué pasó y qué aprendiste">'+esc(r.miss||'')+'</textarea></li>'+
    '<li><p class="tt">El problema número uno</p><textarea rows="2" data-act="revf" data-k="issue" placeholder="Lo único que, si lo resuelves, más te ayuda">'+esc(r.issue||'')+'</textarea></li>'+
    '<li><p class="tt">Tus 3 prioridades para la próxima semana</p><div class="prios">'+prios+'</div></li></ol>'+
    '<div class="add"><button class="btn" data-act="revclose">'+(r.closed?'Actualizar mi plan de la semana':'Cerrar la semana')+'</button></div>'+
    (ai?'<div class="adv-actions"><button class="linkbtn" data-act="revai"'+(cv.busy?' disabled':'')+'>Analizar mi semana con IA</button></div>':'')+
    (cv.busy==='rev'?'<p class="thinking">Buscando patrones…</p>':(r.ai?'<div class="guion out">'+md(r.ai)+'</div>':''))+'</div>'+
    (past.length?'<div class="card"><h3>Semanas anteriores</h3>'+past.map(function(k){var p=g.reviews[k];return '<details class="sop"><summary><b>'+wkLabel(k)+'</b><small>'+esc((p.issue||'').slice(0,80))+'</small></summary>'+
      (p.wins?'<p class="td"><b>Victorias:</b> '+esc(p.wins)+'</p>':'')+(p.miss?'<p class="td"><b>No salió:</b> '+esc(p.miss)+'</p>':'')+(p.issue?'<p class="td"><b>Problema #1:</b> '+esc(p.issue)+'</p>':'')+
      ((p.prios||[]).filter(Boolean).length?'<p class="td"><b>Prioridades:</b> '+(p.prios||[]).filter(Boolean).map(esc).join(' · ')+'</p>':'')+'</details>';}).join('')+'</div>':'');}

function rockTab(){var g=C(),qk=qKey(),left=daysUntil(qEnd(qk)),items=g.rocks.filter(function(r){return r.q===qk;}),ai=sampleState==='ok';
  var RST={on:'En camino',risk:'En riesgo',done:'Lograda'};
  var done=items.filter(function(r){return r.st==='done';}).length;
  var list=items.map(function(r){return '<div class="rock st-'+r.st+'"><div class="dhead"><p class="tt">'+esc(r.t)+'</p><select data-act="rockf" data-id="'+r.id+'" data-f="st" aria-label="Estado">'+opts(RST,r.st)+'</select></div>'+
    (r.res?'<p class="td">Terminada cuando: '+esc(r.res)+'</p>':'')+'<div class="dfields"><input type="text" data-act="rockf" data-id="'+r.id+'" data-f="owner" value="'+esc(r.owner)+'" placeholder="Responsable" aria-label="Responsable">'+
    '<label class="exp"><span>Fecha</span><input type="date" data-act="rockf" data-id="'+r.id+'" data-f="due" value="'+esc(r.due)+'"></label></div><button class="linkbtn del" data-act="rockdel" data-id="'+r.id+'">Quitar</button></div>';}).join('');
  var sug=cv.rockSug.length?'<div class="plan"><p class="essh">Sugerencias</p><ol>'+cv.rockSug.map(function(s,i){return '<li><p class="tt">'+esc(s.titulo)+'</p><p class="td">Terminada cuando: '+esc(s.resultado)+'</p><div class="meta">'+(s.added?'<span class="added">Agregada</span>':'<button class="linkbtn" data-act="rocksugadd" data-i="'+i+'">Agregar</button>')+'</div></li>';}).join('')+'</ol></div>':'';
  var past=g.rocks.filter(function(r){return r.q!==qk;});
  return '<div class="card"><h3>Prioridades del trimestre</h3><p class="hint">De 3 a 5 cosas grandes que, si las logras este trimestre, te acercan a tu próximo escalón. Todo lo demás es secundario.</p>'+
    '<div class="rung-now"><span><b>'+qLabel(qk)+'</b> · '+done+' de '+items.length+' logradas</span><small>Quedan '+left+' días</small></div>'+list+
    (items.length<5?'<div class="add"><input type="text" id="rock-new" placeholder="Nueva prioridad del trimestre" aria-label="Nueva prioridad"><button class="btn" data-act="rockadd">Agregar</button></div>':'<p class="hint" style="margin-top:10px">Ya tienes 5. Más que eso deja de ser prioridad.</p>')+
    (ai?'<div class="adv-actions"><button class="linkbtn" data-act="rockai"'+(cv.busy?' disabled':'')+'>Proponer prioridades con IA</button></div>':'')+
    (cv.busy==='rock'?'<p class="thinking">Pensando en tu trimestre…</p>':sug)+'</div>'+
    (past.length?'<div class="card"><h3>Trimestres anteriores</h3><ul class="posts">'+past.map(function(r){return '<li class="lrow" style="grid-template-columns:70px 1fr auto"><span class="pdate">'+qLabel(r.q)+'</span><p class="tt">'+esc(r.t)+'</p><span class="pillar-tag">'+(RST[r.st]||'')+'</span></li>';}).join('')+'</ul></div>':'');}

function repTab(){var g=C(),ai=sampleState==='ok',m0=ymOf(todayStr()),months=[];for(var i=0;i<7;i++)months.push(addMonths(m0,-i));
  var sel=cv.repMonth||addMonths(m0,-1),rep=g.reports[sel];
  return '<div class="card"><h3>Informe mensual de directorio</h3><p class="hint">Cada mes, mira tu empresa como la miraría un directorio: qué pasó, qué funcionó, qué no y qué decidir.</p>'+
    '<div class="formgrid"><label><span>Mes</span><select data-act="repm">'+months.map(function(m){return '<option value="'+m+'"'+(m===sel?' selected':'')+'>'+ymLabel(m)+(g.reports[m]?' ✓':'')+'</option>';}).join('')+'</select></label></div>'+
    (ai?'<div class="add"><button class="btn" data-act="repgen"'+(cv.busy?' disabled':'')+'>'+(rep?'Volver a generar':'Generar informe')+'</button>'+(rep&&downloadsFn?'<button class="btn ghost" data-act="repdl">Descargar</button>':'')+'</div>':'<p class="hint">El informe se genera con IA cuando está conectada.</p>')+
    (cv.err&&cv.tab==='informe'?'<p class="adv-err">'+esc(cv.err)+'</p>':'')+
    (cv.busy==='rep'?'<p class="thinking">Preparando el informe…</p>':(rep?'<div class="guion out report">'+md(rep)+'</div>':''))+'</div>';}

function decTab(){var g=C(),ai=sampleState==='ok',today=todayStr();
  var due=g.decisions.filter(function(d){return !d.outcome&&d.rev&&d.rev<=today;});
  var lessons=g.decisions.filter(function(d){return d.lesson;});
  var card=function(d){var isDue=!d.outcome&&d.rev&&d.rev<=today;return '<details class="sop dec'+(isDue?' due':'')+'"'+(isDue||cv.openDec===d.id?' open':'')+'><summary><b>'+esc(d.t)+'</b><small>'+dLabel(d.date)+(isDue?' · Toca revisarla':d.outcome?' · Revisada':' · Revisión: '+dLabel(d.rev))+'</small></summary>'+
    (d.why?'<p class="td"><b>Por qué:</b> '+esc(d.why)+'</p>':'')+(d.exp?'<p class="td"><b>Lo que esperaba:</b> '+esc(d.exp)+'</p>':'')+
    (d.devil?'<div class="guion out"><p class="essh">Abogada del diablo</p>'+md(d.devil)+'</div>':'')+
    (ai&&!d.outcome?'<div class="adv-actions"><button class="linkbtn" data-act="decdevil" data-id="'+d.id+'"'+(cv.busy?' disabled':'')+'>'+(cv.busy==='dec'+d.id?'Buscando los puntos débiles…':(d.devil?'Revisar de nuevo':'Pedir abogada del diablo'))+'</button></div>':'')+
    '<div class="formgrid"><label class="wide"><span>¿Qué pasó realmente?</span><textarea rows="2" data-act="decf" data-id="'+d.id+'" data-f="outcome">'+esc(d.outcome||'')+'</textarea></label>'+
    '<label class="wide"><span>Lo que aprendí (tu principio)</span><textarea rows="2" data-act="decf" data-id="'+d.id+'" data-f="lesson" placeholder="Ej.: nunca lanzo sin probar el precio con 10 clientes">'+esc(d.lesson||'')+'</textarea></label></div>'+
    '<button class="linkbtn del" data-act="decdel" data-id="'+d.id+'">Eliminar</button></details>';};
  return (due.length?'<div class="alertbox"><p class="essh">Toca revisar</p><p class="td">'+due.length+' decisión'+(due.length>1?'es':'')+' ya llegaron a su fecha de revisión. Compara lo que esperabas con lo que pasó.</p></div>':'')+
    '<div class="card"><h3>Diario de decisiones</h3><p class="hint">Anota cada decisión importante con lo que esperas que pase. En la fecha de revisión, compara. Así aprendes de tu propio criterio.</p>'+
    '<div class="formgrid"><label class="wide"><span>La decisión</span><input type="text" id="dec-t" placeholder="Ej.: invertir $500 en anuncios en octubre"></label>'+
    '<label class="wide"><span>Por qué la tomo</span><textarea rows="2" id="dec-why"></textarea></label>'+
    '<label class="wide"><span>Qué espero que pase</span><textarea rows="2" id="dec-exp" placeholder="Algo que puedas comprobar: 20 ventas, $2.000…"></textarea></label>'+
    '<label><span>Revisar el</span><input type="date" id="dec-rev" value="'+addDays(today,90)+'"></label></div>'+
    '<div class="add"><button class="btn" data-act="decadd">Guardar decisión</button></div>'+
    (cv.err&&cv.tab==='decisiones'?'<p class="adv-err">'+esc(cv.err)+'</p>':'')+
    g.decisions.slice().reverse().map(card).join('')+'</div>'+
    (lessons.length?'<div class="card why"><h3>Mis principios de CEO</h3><ul class="principles">'+lessons.map(function(d){return '<li>'+esc(d.lesson)+'</li>';}).join('')+'</ul></div>':'');}

function controlView(){var tabs=[['score','Números',1],['semana','Semana',1],['trimestre','Trimestre',2],['informe','Informe',2],['decisiones','Decisiones',3]];
  var ctl=tabs.filter(function(t){return t[0]===cv.tab;})[0]||tabs[0];
  var body=!unlocked(ctl[2])?lockedCard(ctl[1]==='Trimestre'?'Prioridades del trimestre':ctl[1]==='Informe'?'Informe mensual de directorio':'Diario de decisiones',ctl[2]):cv.tab==='semana'?revTab():cv.tab==='trimestre'?rockTab():cv.tab==='informe'?repTab():cv.tab==='decisiones'?decTab():scoreTab();
  return '<div class="view"><div class="head"><h2>Control</h2><p>Mide, revisa y prioriza. Este es el ritmo que convierte metas en crecimiento constante.</p></div>'+
    '<div class="seg seg5" role="group" aria-label="Secciones de control">'+tabs.map(function(t){return '<button data-act="ctab" data-v="'+t[0]+'" aria-pressed="'+(cv.tab===t[0])+'"'+(unlocked(t[2])?'':' class="lk-tab"')+'>'+(unlocked(t[2])?'':LOCK_SVG)+t[1]+'</button>';}).join('')+'</div>'+
    (cv.err&&(cv.tab==='semana'||cv.tab==='trimestre')?'<p class="adv-err">'+esc(cv.err)+'</p>':'')+body+'</div>';}

function controlText(){var g=C(),wk=thisWeek(),L=[];
  if(g.kpis.length){L.push('Scorecard semanal (últimas 4 semanas, valor / meta):');g.kpis.forEach(function(k){var vs=[];for(var i=3;i>=0;i--){vs.push(fmtK(k,kpiVal(k,addDays(wk,-7*i))));}L.push('- '+k.n+': '+vs.join(' → ')+(k.target!==''&&k.target!=null?' (meta '+fmtK(k,num(k.target))+(k.dir==='down'?', mejor si baja':'')+')':''));});}
  var rk=g.rocks.filter(function(r){return r.q===qKey();});if(rk.length)L.push('Prioridades del trimestre: '+rk.map(function(r){return r.t+' ['+(r.st==='done'?'lograda':r.st==='risk'?'en riesgo':'en camino')+']';}).join('; '));
  var lastRev=Object.keys(g.reviews).sort().reverse()[0];if(lastRev){var r=g.reviews[lastRev];if(r.issue)L.push('Problema #1 de su última revisión semanal: '+r.issue.slice(0,300));}
  var pr=g.decisions.filter(function(d){return d.lesson;}).slice(-5).map(function(d){return d.lesson;});if(pr.length)L.push('Sus principios aprendidos: '+pr.join(' | '));
  return L.join('\n');}

function ctlErr(e){var code=e&&e.code;if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].indexOf(code)>-1)sampleState='denied';else if(code!=='cancelled')cv.err=errCopy(code);}
function revAI(){if(!sampleFn||cv.busy)return;cv.busy='rev';cv.err='';render();var g=C(),wk=thisWeek(),r=g.reviews[wk]||{};
  var prev=Object.keys(g.reviews).filter(function(k){return k<wk;}).sort().reverse().slice(0,4).map(function(k){var p=g.reviews[k];return wkLabel(k)+': problema #1 "'+(p.issue||'-')+'"; no salió: "'+(p.miss||'-')+'"';}).join('\n');
  var prompt=instructions('grow')+'\n\nREVISIÓN DE ESTA SEMANA:\nVictorias: '+(r.wins||'-')+'\nNo salió: '+(r.miss||'-')+'\nProblema #1: '+(r.issue||'-')+'\nPrioridades que propone: '+((r.prios||[]).filter(Boolean).join('; ')||'-')+'\n\nREVISIONES ANTERIORES:\n'+(prev||'(ninguna)')+
   '\n\nTAREA: Actúa como su mentora en la revisión semanal. Escribe:\n**Lo que dicen tus números** (qué mejora, qué empeora, con cifras).\n**El patrón** (algo que se repite entre semanas, si existe; si no hay datos suficientes, dilo).\n**Tus prioridades** (¿atacan el problema #1 y su escalón actual? Ajusta si no).\n**Una cosa para dejar de hacer**.\nSé directa y cálida. Máximo 250 palabras.';
  sampleFn(prompt,{cache:false}).then(function(res){var gg=C();gg.reviews[wk]=gg.reviews[wk]||{};gg.reviews[wk].ai=String(res.text).slice(0,5000);commit(true);}).catch(ctlErr).then(function(){cv.busy=null;render();});}
function rockAI(){if(!sampleFn||cv.busy)return;cv.busy='rock';cv.err='';render();

// --- Fuera de Claude (p. ej. Vercel): IA a través de /api/claude y descargas con el navegador
function webInit(){
  var CODE_KEY='athenea:code',API='/api/claude';
  function getCode(){try{return localStorage.getItem(CODE_KEY)||'';}catch(e){return '';}}
  function setCode(v){try{if(v)localStorage.setItem(CODE_KEY,v);else localStorage.removeItem(CODE_KEY);}catch(e){}}
  function call(turns,opts,json,retried){
    opts=opts||{};var text='';
    return fetch(API,{method:'POST',headers:{'content-type':'application/json','x-athenea-code':getCode()},body:JSON.stringify({messages:turns,json:!!json}),signal:opts.signal})
    .then(function(res){
      if(res.status===401){
        setCode('');if(retried)throw {code:'not_granted'};
        var c=window.prompt('Escribe el código de acceso de Athenea');
        if(!c)throw {code:'not_granted'};setCode(c.trim());return call(turns,opts,json,true);
      }
      if(res.status===429)throw {code:'rate_limited'};
      if(!res.ok||!res.body)throw {code:'server_error'};
      var reader=res.body.getReader(),dec=new TextDecoder(),buf='',out=null;
      function line(l){if(!l)return;var m=JSON.parse(l);
        if(m.t){text+=m.t;if(opts.onText)opts.onText({text:text});}
        else if(m.error)throw {code:m.error,text:text};
        else if(m.done)out={text:text,truncated:!!m.truncated};}
      function pump(){return reader.read().then(function(r){
        if(r.value){buf+=dec.decode(r.value,{stream:true});var parts=buf.split('\n');buf=parts.pop();parts.forEach(line);}
        if(r.done){line(buf.trim());if(!out)throw {code:'server_error',text:text};return out;}
        return pump();});}
      return pump();
    })
    .catch(function(e){
      if(opts.signal&&opts.signal.aborted)throw {code:'cancelled',text:text};
      if(e&&e.code)throw e;throw {code:'network',text:text};
    });
  }
  function toTurns(x){return typeof x==='string'?[{role:'user',content:x}]:x;}
  var sample=function(x,opts){return call(toTurns(x),opts,false);};
  sample.json=function(x,opts){return call(toTurns(x),opts,true).then(function(r){
    var s=String(r.text).replace(/^\s*```(?:json)?\s*/i,'').replace(/\s*```\s*$/,'');
    var a=s.indexOf('{'),b=s.lastIndexOf('}');
    try{return JSON.parse(a>-1&&b>a?s.slice(a,b+1):s);}catch(e){throw {code:'invalid_json'};}
  });};
  downloadsFn={save:function(o){try{
    var blob=new Blob([o.data],{type:/\.csv$/i.test(o.filename)?'text/csv;charset=utf-8':'text/plain;charset=utf-8'});
    var url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=o.filename||'archivo.txt';
    document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},1000);
    return Promise.resolve();}catch(e){return Promise.reject({code:'unavailable'});}}};
  render();
  fetch(API).then(function(r){return r.ok?r.json():null;}).then(function(s){
    if(s&&s.ok){sampleFn=sample;sampleState='ok';}else sampleState='off';render();
  }).catch(function(){sampleState='off';render();});
}
})();
